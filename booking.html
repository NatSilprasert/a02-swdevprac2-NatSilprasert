<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จองคลาสออกกำลังกาย — Pulse Fitness Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#ff4f00;
    --on-primary:#fffefb;
    --ink:#201515;
    --body:#605d52;
    --body-mid:#939084;
    --mute:#c5c0b1;
    --canvas:#fffefb;
    --canvas-soft:#f8f4f0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--canvas);
    color:var(--ink);
    font-family:'IBM Plex Sans Thai','Inter',system-ui,-apple-system,sans-serif;
  }
  a{text-decoration:none;color:inherit;}

  .nav-bar{
    background:var(--canvas);
    color:var(--ink);
    padding:12px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:1280px;
    margin:0 auto;
  }
  .nav-bar .logo{
    font-family:'Degular Display','IBM Plex Sans Thai','Inter',system-ui,sans-serif;
    font-weight:500;
    font-size:20px;
    letter-spacing:1px;
  }
  .nav-bar .logo span{color:var(--primary);}
  .nav-link{font-size:16px;}

  .page-head{
    max-width:720px;
    margin:0 auto;
    padding:48px 24px 0 24px;
    text-align:center;
  }
  .eyebrow{
    font-family:'Degular Display','IBM Plex Sans Thai','Inter',system-ui,sans-serif;
    font-size:14px;
    font-weight:500;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--primary);
    margin-bottom:16px;
  }
  .page-head h1{
    font-family:'Degular Display','IBM Plex Sans Thai','Inter',system-ui,sans-serif;
    font-weight:500;
    font-size:48px;
    line-height:48px;
    margin:0 0 16px 0;
  }
  .page-head p{
    color:var(--body);
    font-size:18px;
    line-height:27px;
    margin:0 0 32px 0;
  }

  main{
    max-width:720px;
    margin:0 auto;
    padding:0 24px 64px 24px;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:32px;
  }

  .form-section{
    background:var(--canvas-soft);
    border-radius:12px;
    padding:24px;
  }
  .form-section h2{
    font-size:24px;
    font-weight:600;
    line-height:30px;
    letter-spacing:-0.6px;
    margin:0 0 24px 0;
  }

  .field{
    margin-bottom:20px;
  }
  .field:last-child{margin-bottom:0;}
  .field label{
    display:block;
    font-size:16px;
    font-weight:600;
    line-height:24px;
    margin-bottom:8px;
  }
  .field .hint{
    font-size:14px;
    line-height:21px;
    color:var(--body-mid);
    font-weight:400;
    margin-left:4px;
  }
  input[type="text"],
  input[type="tel"],
  input[type="email"],
  input[type="number"],
  input[type="date"],
  select,
  textarea{
    width:100%;
    background:var(--canvas);
    color:var(--ink);
    border:1px solid var(--ink);
    border-radius:6px;
    padding:12px 16px;
    font-size:18px;
    font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;
  }
  textarea{
    resize:vertical;
    min-height:96px;
  }
  input:focus,select:focus,textarea:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }

  .radio-group{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .radio-option{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:16px;
    line-height:24px;
  }
  .radio-option input{
    width:18px;
    height:18px;
    accent-color:var(--primary);
  }

  .checkbox-field{
    display:flex;
    align-items:flex-start;
    gap:12px;
    background:var(--canvas-soft);
    border-radius:12px;
    padding:24px;
  }
  .checkbox-field input{
    margin-top:4px;
    width:18px;
    height:18px;
    accent-color:var(--primary);
    flex-shrink:0;
  }
  .checkbox-field label{
    font-size:16px;
    line-height:24px;
  }

  .btn-primary{
    display:inline-block;
    width:100%;
    background:var(--primary);
    color:var(--on-primary);
    font-size:18px;
    font-weight:600;
    line-height:27px;
    text-align:center;
    padding:12px 24px;
    border-radius:12px;
    border:none;
    cursor:pointer;
    font-family:'IBM Plex Sans Thai','Inter',system-ui,sans-serif;
  }

  .footer{
    background:var(--ink);
    color:var(--mute);
    padding:32px 24px;
    text-align:center;
    font-size:14px;
    line-height:21px;
  }

  @media (max-width:600px){
    .page-head h1{font-size:36px;line-height:40px;}
  }
</style>
</head>
<body>

  <nav class="nav-bar">
    <a class="logo" href="index.html">Pulse<span>.</span></a>
    <a class="nav-link" href="index.html">กลับไปดูคลาสทั้งหมด</a>
  </nav>

  <div class="page-head">
    <div class="eyebrow">Booking</div>
    <h1>จองคลาสออกกำลังกาย</h1>
    <p>กรอกข้อมูลด้านล่างเพื่อจองที่นั่งในคลาสที่คุณสนใจ ทีมงานจะติดต่อกลับเพื่อยืนยันสิทธิ์อีกครั้ง</p>
  </div>

  <main>
    <form>

      <section class="form-section">
        <h2>ข้อมูลผู้จอง</h2>

        <div class="field">
          <label for="fullname">ชื่อ–นามสกุล</label>
          <input type="text" id="fullname" name="fullname" required>
        </div>

        <div class="field">
          <label for="phone">หมายเลขโทรศัพท์</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{9,10}" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="field">
          <label for="age">อายุ <span class="hint">(กรอกได้เฉพาะตัวเลข)</span></label>
          <input type="number" id="age" name="age" min="1" max="120" step="1" required>
        </div>
      </section>

      <section class="form-section">
        <h2>ข้อมูลการจองคลาส</h2>

        <div class="field">
          <label for="class-select">เลือกคลาสออกกำลังกาย</label>
          <select id="class-select" name="class-select" required>
            <option value="" disabled selected>-- กรุณาเลือกคลาส --</option>
            <option value="yoga">Yoga Flow</option>
            <option value="pilates">Pilates Core</option>
            <option value="cycling">Indoor Cycling</option>
            <option value="boxing">Boxing Blast</option>
          </select>
        </div>

        <div class="field">
          <label for="class-date">วันที่ต้องการเข้าเรียน</label>
          <input type="date" id="class-date" name="class-date" required>
        </div>

        <div class="field">
          <label for="time-slot">ช่วงเวลา</label>
          <select id="time-slot" name="time-slot" required>
            <option value="" disabled selected>-- กรุณาเลือกช่วงเวลา --</option>
            <option value="09:00-10:30">09:00–10:30</option>
            <option value="10:30-12:00">10:30–12:00</option>
            <option value="13:00-14:30">13:00–14:30</option>
            <option value="16:00-17:30">16:00–17:30</option>
          </select>
        </div>

        <div class="field">
          <label>ระดับประสบการณ์ในการออกกำลังกาย</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="exp-none" name="experience" value="none" required>
              <label for="exp-none">ไม่เคยเข้าคลาสมาก่อน</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="exp-some" name="experience" value="some">
              <label for="exp-some">มีประสบการณ์เล็กน้อย</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="exp-regular" name="experience" value="regular">
              <label for="exp-regular">ออกกำลังกายรูปแบบนี้เป็นประจำ</label>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="notes">ข้อจำกัดในการออกกำลังกาย / ข้อความเพิ่มเติม</label>
          <textarea id="notes" name="notes" rows="4" placeholder="เช่น อาการบาดเจ็บ, โรคประจำตัว, หรือข้อความอื่น ๆ"></textarea>
        </div>
      </section>

      <div class="checkbox-field">
        <input type="checkbox" id="confirm" name="confirm" required>
        <label for="confirm">ข้าพเจ้ายืนยันว่าข้อมูลที่กรอกเป็นความจริง และเข้าใจว่าการส่งแบบฟอร์มนี้ยังไม่ถือเป็นการยืนยันสิทธิ์เข้าเรียน</label>
      </div>

      <button type="submit" class="btn-primary">ส่งแบบฟอร์มจองคลาส</button>

    </form>
  </main>

  <footer class="footer">
    6730149721 Nat Silprasert
  </footer>

</body>
</html>
